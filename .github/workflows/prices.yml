name: Refresh hourly prices

# Keeps data/kraken-hourly.json current so the checker loads months of
# hourly ETH/BTC closes from the repo instead of hammering Kraken.
# Runs daily at 06:05 UTC (after Kraken's day rollover); can also be
# triggered manually from the Actions tab.

on:
  schedule:
    - cron: '5 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update hourly prices
        run: node dev/fetch-prices.mjs --update
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/kraken-hourly.json
          if git diff --cached --quiet; then
            echo 'No price changes.'
          else
            git commit -m 'chore: refresh kraken-hourly.json'
            git push
          fi
